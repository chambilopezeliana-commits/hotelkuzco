services:
  app:
    build: .
    container_name: hotel_app
    environment:
      APP_NAME: "Hotel Kuzco"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY:?Defina APP_KEY en el archivo .env antes de iniciar Docker}"
      APP_URL: "http://localhost:8080"
      APP_TIMEZONE: "America/La_Paz"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: hotel
      DB_USERNAME: hotel
      DB_PASSWORD: "${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en el archivo .env antes de iniciar Docker}"
      SEED_ADMIN_NAME: "${SEED_ADMIN_NAME:-Administrador}"
      SEED_ADMIN_EMAIL: "${SEED_ADMIN_EMAIL:-}"
      SEED_ADMIN_PASSWORD: "${SEED_ADMIN_PASSWORD:-}"
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_public:/var/www/html/public

  nginx:
    image: nginx:1.27-alpine
    container_name: hotel_nginx
    ports:
      - "8080:80"
    volumes:
      - app_public:/var/www/html/public:ro
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: postgres:16-alpine
    container_name: hotel_db
    environment:
      POSTGRES_DB: hotel
      POSTGRES_USER: hotel
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en el archivo .env antes de iniciar Docker}"
    volumes:
      - hotel_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel -d hotel"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  app_public:
  hotel_pgdata:
