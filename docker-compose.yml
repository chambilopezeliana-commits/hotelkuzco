services:
  app:
    build: .
    container_name: hotel_app
    environment:
      APP_NAME: "Hotel Kuzco"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "base64:1lF7HcIevpWJKZTK2y0BE7BdfQVEadLn2pNjG8XxSpM="
      APP_URL: "http://localhost:8080"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: hotel
      DB_USERNAME: hotel
      DB_PASSWORD: hotel_secret
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/var/www/html

  nginx:
    image: nginx:1.27-alpine
    container_name: hotel_nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: postgres:16-alpine
    container_name: hotel_db
    environment:
      POSTGRES_DB: hotel
      POSTGRES_USER: hotel
      POSTGRES_PASSWORD: hotel_secret
    ports:
      - "5432:5432"
    volumes:
      - hotel_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel -d hotel"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hotel_pgdata:
